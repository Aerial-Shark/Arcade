<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crate Shift · Afterglow Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Outfit:wght@400;600&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
.bar{position:fixed;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);display:flex;justify-content:center;gap:10px}
</style>
</head>
<body>
<div class="bar"><button class="k-btn ghost" id="undo" type="button">Undo</button><button class="k-btn ghost" id="again" type="button">Restart level</button></div>
<script src="../../shared/config.js"></script>
<script src="../../shared/leaderboard.js"></script>
<script src="../../shared/kit.js"></script>
<script>
(() => {
  'use strict';
  /* Layout: full-screen canvas with the level grid centred; Undo and Restart sit in a bar above the bottom edge. */
  const { beep } = Kit;
  const K = Kit.canvas(), ctx = K.ctx, set = Kit.hud(['Level', 'Score', 'Moves']);
  // # wall, . goal, $ crate, @ you, * crate on goal
  const LEVELS = [
    ['#######', '#     #', '# @$. #', '#     #', '#######'],
    ['#######', '#.  $ #', '#  @  #', '# $  .#', '#######'],
    ['########', '#  .   #', '# $$   #', '# @  . #', '########'],
    ['#########', '#   #   #', '# $ # . #', '#   $   #', '# . #  @#', '#########'],
    ['########', '#  #   #', '# $  $ #', '#.@#  .#', '#  $  .#', '########'],
    ['#########', '#  . .  #', '# $$ $$ #', '#  .@.  #', '#########'],
    ['#########', '#@  #   #', '# $$  . #', '# $ # . #', '#   # . #', '#########']
  ];
  let lv = 0, walls, goals, crates, me, moves = 0, score = 0, total = 0, hist = [], playing = false, t0 = null, rows, cols;
  const key = (x, y) => x + ',' + y;

  function load(i) {
    lv = i; walls = new Set(); goals = new Set(); crates = new Set(); moves = 0; hist = [];
    const L = LEVELS[i]; rows = L.length; cols = Math.max(...L.map(r => r.length));
    L.forEach((r, y) => [...r].forEach((c, x) => {
      if (c === '#') walls.add(key(x, y));
      if (c === '.' || c === '*') goals.add(key(x, y));
      if (c === '$' || c === '*') crates.add(key(x, y));
      if (c === '@') me = [x, y];
    }));
  }
  function reset() { score = 0; total = 0; load(0); playing = true; }
  function move(dx, dy) {
    if (!playing || Kit.busy()) return;
    const nx = me[0] + dx, ny = me[1] + dy, k = key(nx, ny);
    if (walls.has(k)) return;
    let pushed = null;
    if (crates.has(k)) {
      const k2 = key(nx + dx, ny + dy);
      if (walls.has(k2) || crates.has(k2)) return;
      crates.delete(k); crates.add(k2); pushed = [k, k2]; beep(goals.has(k2) ? 660 : 220, .07);
    }
    hist.push({ me, pushed }); me = [nx, ny]; moves++; total++;
    if ([...crates].every(c => goals.has(c))) win();
  }
  function undo() {
    if (!playing || !hist.length || Kit.busy()) return;
    const h = hist.pop(); me = h.me; moves--; total--;
    if (h.pushed) { crates.delete(h.pushed[1]); crates.add(h.pushed[0]); }
  }
  function win() {
    score += Math.max(100, 1000 - moves * 8); beep(784, .12); setTimeout(() => beep(1047, .18), 110);
    if (lv + 1 < LEVELS.length) { playing = false; setTimeout(() => { load(lv + 1); playing = true; }, 550); }
    else { playing = false; setTimeout(() => Kit.over('crates', score, 'Every crate home', 'All ' + LEVELS.length + ' levels cleared in ' + total + ' moves.', [['Moves', total]], reset), 450); }
  }
  function draw() {
    ctx.clearRect(0, 0, K.w, K.h);
    if (!walls) return;
    const c = Math.floor(Math.min((K.w - 20) / cols, (K.h - 240) / rows, 58)), ox = (K.w - c * cols) / 2, oy = 90 + (K.h - 240 - c * rows) / 2;
    const box = (x, y, pad, col, r) => { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(ox + x * c + pad, oy + y * c + pad, c - pad * 2, c - pad * 2, r); ctx.fill(); };
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const k = key(x, y);
      if (walls.has(k)) box(x, y, 1, '#2a2660', 6); else if ((LEVELS[lv][y] || '')[x] !== undefined) box(x, y, 1, 'rgba(20,18,51,.9)', 4);
      if (goals.has(k)) { ctx.strokeStyle = '#e8c36a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ox + x * c + c / 2, oy + y * c + c / 2, c * .2, 0, 7); ctx.stroke(); }
      if (crates.has(k)) { box(x, y, c * .12, goals.has(k) ? '#8fe3a1' : '#e8c36a', 7); ctx.strokeStyle = 'rgba(10,12,36,.45)'; ctx.lineWidth = 2; ctx.strokeRect(ox + x * c + c * .28, oy + y * c + c * .28, c * .44, c * .44); }
    }
    ctx.fillStyle = '#f3eefe'; ctx.shadowColor = '#f3eefe'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(ox + me[0] * c + c / 2, oy + me[1] * c + c / 2, c * .3, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }

  Kit.start({ title: 'Crate Shift', eyebrow: 'Puzzle', hue: '#e8c36a',
    text: 'Push every crate onto a ring. You can only push, never pull, and only one crate at a time. Fewer moves score more. Swipe or use the arrow keys. Undo is U and restart is R.',
    onStart: reset });
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('again').addEventListener('click', () => { if (playing && !Kit.busy()) { total -= moves; load(lv); } });
  document.querySelector('.bar').addEventListener('pointerdown', e => e.stopPropagation());
  const DIRS = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
  window.addEventListener('keydown', e => {
    if (Kit.busy()) return;
    const k = e.key.toLowerCase(), d = DIRS[k];
    if (d) { e.preventDefault(); move(d[0], d[1]); } else if (k === 'u' || k === 'z') undo(); else if (k === 'r') document.getElementById('again').click();
  });
  window.addEventListener('pointerdown', e => { t0 = [e.clientX, e.clientY]; });
  window.addEventListener('pointerup', e => {
    if (!t0) return;
    const dx = e.clientX - t0[0], dy = e.clientY - t0[1]; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) move(Math.sign(dx), 0); else move(0, Math.sign(dy));
  });
  Kit.loop(() => { draw(); if (walls) set((lv + 1) + '/' + LEVELS.length, score.toLocaleString(), moves); });
  window.CRATE_LEVELS = LEVELS;
})();
</script>
</body>
</html>
