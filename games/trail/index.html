<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glow Trail · Afterglow Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Outfit:wght@400;600&display=swap">
<link rel="stylesheet" href="../../shared/kit.css">
</head>
<body>
<script src="../../shared/config.js"></script>
<script src="../../shared/leaderboard.js"></script>
<script src="../../shared/kit.js"></script>
<script>
(() => {
  'use strict';
  /* Layout: full-screen canvas with one centred board of square cells under the HUD. */
  const { beep } = Kit;
  const K = Kit.canvas(), ctx = K.ctx, set = Kit.hud(['Length', 'Score', 'Speed']);
  const COLS = 17, ROWS = 21;
  let snake = [], dir = [1, 0], queue = [], food = null, star = null, score = 0, eaten = 0, acc = 0, playing = false, t0 = null;
  const tick = () => Math.max(.065, .16 - eaten * .0035);
  const board = () => { const c = Math.floor(Math.min((K.w - 20) / COLS, (K.h - 150) / ROWS)); return { c, x: Math.round((K.w - c * COLS) / 2), y: 84 + Math.max(0, Math.round((K.h - 150 - c * ROWS) / 2)) }; };
  const free = () => { let p; do { p = [Math.random() * COLS | 0, Math.random() * ROWS | 0]; } while (snake.some(s => s[0] === p[0] && s[1] === p[1]) || (food && food[0] === p[0] && food[1] === p[1])); return p; };

  function reset() { snake = [[8, 10], [7, 10], [6, 10]]; dir = [1, 0]; queue = []; score = 0; eaten = 0; acc = 0; star = null; food = null; food = free(); playing = true; }
  function turn(x, y) {
    if (!playing || Kit.busy()) return;
    const l = queue.length ? queue[queue.length - 1] : dir;
    if ((x === -l[0] && y === -l[1]) || (x === l[0] && y === l[1]) || queue.length > 1) return;
    queue.push([x, y]);
  }
  function step() {
    if (queue.length) dir = queue.shift();
    const h = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
    const tail = snake[snake.length - 1];
    if (h[0] < 0 || h[1] < 0 || h[0] >= COLS || h[1] >= ROWS || snake.some(s => s !== tail && s[0] === h[0] && s[1] === h[1])) {
      playing = false;
      Kit.over('trail', score, 'Crashed', 'Your trail grew to ' + snake.length + ' cells.', [['Length', snake.length]], reset);
      return;
    }
    snake.unshift(h);
    if (h[0] === food[0] && h[1] === food[1]) {
      eaten++; score += 10 + Math.floor(snake.length / 5) * 2; beep(620 + (eaten % 6) * 50, .07);
      food = free(); if (eaten % 5 === 0) star = { p: free(), ttl: 40 };
    } else if (star && h[0] === star.p[0] && h[1] === star.p[1]) {
      score += 50; star = null; beep(990, .15); snake.pop();
    } else snake.pop();
    if (star && --star.ttl <= 0) star = null;
  }
  function cell(b, p, pad, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(b.x + p[0] * b.c + pad, b.y + p[1] * b.c + pad, b.c - pad * 2, b.c - pad * 2, b.c * .28); ctx.fill(); }
  function draw(t) {
    const b = board();
    ctx.clearRect(0, 0, K.w, K.h);
    ctx.fillStyle = 'rgba(20,18,51,.85)'; ctx.strokeStyle = 'rgba(178,171,216,.25)';
    ctx.beginPath(); ctx.roundRect(b.x - 4, b.y - 4, b.c * COLS + 8, b.c * ROWS + 8, 10); ctx.fill(); ctx.stroke();
    if (food) { ctx.shadowColor = '#ffcf73'; ctx.shadowBlur = 12; cell(b, food, b.c * .22, '#ffcf73'); ctx.shadowBlur = 0; }
    if (star) { ctx.globalAlpha = star.ttl < 12 ? .4 + .6 * Math.abs(Math.sin(t * 10)) : 1; cell(b, star.p, b.c * .12, '#ff8fd0'); ctx.globalAlpha = 1; }
    snake.forEach((s, i) => { ctx.globalAlpha = Math.max(.35, 1 - i / (snake.length + 6)); cell(b, s, 1, i ? '#a3e36f' : '#f3ffe0'); });
    ctx.globalAlpha = 1;
  }

  Kit.start({ title: 'Glow Trail', eyebrow: 'Snake', hue: '#a3e36f',
    text: 'Steer the trail to the gold cells. Each one makes you longer and faster. Pink cells are bonus points that vanish quickly. Do not hit the walls or yourself. Swipe, or use the arrow keys.',
    onStart: reset });
  const DIRS = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
  window.addEventListener('keydown', e => { const d = DIRS[e.key.toLowerCase()]; if (d && !Kit.busy()) { e.preventDefault(); turn(d[0], d[1]); } });
  window.addEventListener('pointerdown', e => { t0 = [e.clientX, e.clientY]; });
  window.addEventListener('pointermove', e => {
    if (!t0) return;
    const dx = e.clientX - t0[0], dy = e.clientY - t0[1];
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    t0 = [e.clientX, e.clientY];
  });
  window.addEventListener('pointerup', () => { t0 = null; }); window.addEventListener('pointercancel', () => { t0 = null; });
  Kit.loop((dt, t) => {
    if (playing && !Kit.busy()) { acc += dt; while (acc >= tick() && playing) { acc -= tick(); step(); } set(snake.length, score.toLocaleString(), Math.round(1 / tick()) + '/s'); }
    draw(t);
  });
})();
</script>
</body>
</html>
